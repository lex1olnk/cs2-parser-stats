# ВНИМАНИЕ: файл лежит в nextapp/workflows/, а не в .github/workflows/,
# поэтому GitHub Actions его НЕ запускает. Чтобы включить автодеплой,
# перенеси его в .github/workflows/deploy.yml.

name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ulmixcup
            ./migrate.sh
